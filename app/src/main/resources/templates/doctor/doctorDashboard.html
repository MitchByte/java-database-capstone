<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <section class="doctor-dashboard" aria-labelledby="dashboard-title">
                    <div class="dashboard-heading">
                        <div>
                            <p class="eyebrow">Doctor workspace</p>
                            <h1 id="dashboard-title">My appointments</h1>
                            <p class="dashboard-description">Review your schedule and access patient information for your appointments.</p>
                        </div>
                    </div>

                    <div class="appointment-tools" role="search" aria-label="Search and filter appointments">
                        <label class="visually-hidden" for="searchBar">Search appointments</label>
                        <input
                            type="search"
                            id="searchBar"
                            class="searchBar"
                            placeholder="Search by patient name..."
                            autocomplete="off">

                        <div class="appointment-filters">
                            <button type="button" id="todayButton" class="button">Today's appointments</button>
                            <label class="visually-hidden" for="datePicker">Choose appointment date</label>
                            <input type="date" id="datePicker" class="date-picker">
                        </div>
                    </div>

                    <div class="table-container">
                        <table id="patientTable" class="appointment-table">
                            <caption class="visually-hidden">Patients with appointments assigned to this doctor</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Patient ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Phone No.</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Prescription</th>
                                </tr>
                            </thead>
                            <tbody id="patientTableBody">
                                <tr>
                                    <td colspan="5" class="loading-message">Loading appointments...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</body>
</html>
