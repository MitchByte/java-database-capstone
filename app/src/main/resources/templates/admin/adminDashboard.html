<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <section class="dashboard" aria-labelledby="dashboard-title">
                    <div class="dashboard-heading">
                        <div>
                            <p class="eyebrow">Clinic administration</p>
                            <h1 id="dashboard-title">Doctor management</h1>
                            <p class="dashboard-description">View and manage doctor profiles, specialties, and appointment availability.</p>
                        </div>
                        <button type="button" id="addDoctorBtn" class="adminBtn">Add Doctor</button>
                    </div>

                    <div class="doctor-tools" role="search" aria-label="Search and filter doctors">
                        <label class="visually-hidden" for="searchBar">Search doctors</label>
                        <input
                            type="search"
                            id="searchBar"
                            class="searchBar"
                            placeholder="Search by doctor name..."
                            autocomplete="off">

                        <div class="filter-wrapper">
                            <label class="visually-hidden" for="timeFilter">Filter by available time</label>
                            <select id="timeFilter" class="filter-select">
                                <option value="">All times</option>
                                <option value="AM">Morning (AM)</option>
                                <option value="PM">Afternoon (PM)</option>
                            </select>

                            <label class="visually-hidden" for="specialtyFilter">Filter by specialty</label>
                            <select id="specialtyFilter" class="filter-select">
                                <option value="">All specialties</option>
                                <option value="cardiologist">Cardiology</option>
                                <option value="dermatologist">Dermatology</option>
                                <option value="dentist">Dentistry</option>
                                <option value="general">General Physician</option>
                                <option value="gynecologist">Gynecology</option>
                                <option value="neurologist">Neurology</option>
                                <option value="ophthalmologist">Ophthalmology</option>
                                <option value="orthopedic">Orthopedics</option>
                                <option value="pediatrician">Pediatrics</option>
                                <option value="psychiatrist">Psychiatry</option>
                            </select>
                        </div>
                    </div>

                    <div id="content" class="doctor-list" aria-live="polite" aria-label="Doctor profiles">
                        <p class="loading-message">Loading doctor profiles...</p>
                    </div>
                </section>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Doctor profile form">
        <div class="modal-content">
            <button type="button" id="closeModal" class="close" aria-label="Close dialog">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="../js/services/adminDashboard.js" defer></script>
    <script type="module" src="../js/components/doctorCard.js" defer></script>
</body>
</html>
